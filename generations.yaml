generations:
  - name: "First Generation (X3)"
    start_year: 1994
    end_year: 1999
    description: "The original Hyundai Accent/Verna (X3) replaced the Excel in 1994 with conservative, boxy styling typical of 1990s compact sedans. Sold under various names including Excel in some markets and Dodge Brisa in Venezuela, it was powered by 1.3L to 1.5L Alpha series four-cylinder engines with both SOHC and DOHC options. Available as sedan, 3-door liftback, and 5-door hatchback depending on the market. The interior was basic but functional with durable materials. Production in South Korea ran until 1999, but continued in Egypt (until 2006), Indonesia (until 2005), and China (until 2006). This generation established the Verna nameplate in South Korea specifically, while most international markets retained the Accent name."

  - name: "Second Generation (LC)"
    start_year: 1999
    end_year: 2006
    description: "The second-generation Accent/Verna (LC) featured more angular styling with increased dimensions over its predecessor. This was the first generation to carry the Verna nameplate in South Korea specifically. Available as 4-door sedan, 3-door liftback, and 5-door hatchback, it was built on the Hyundai-Kia TB platform. Engine options included revised 1.3L and 1.5L petrol engines plus a new 1.6L DOHC 16-valve from 2001, and notably the first Accent with a diesel option - a 1.5L three-cylinder CRDi turbodiesel. The interior saw improvements in design and material quality. Production continued in various markets including Egypt (until 2019) and Russia (as Accent until 2011), making it one of the longest-running generations."

  - name: "Third Generation (MC)"
    start_year: 2005
    end_year: 2010
    description: "The third-generation Accent/Verna (MC) introduced at the 2005 New York Auto Show featured a new exterior design, larger interior space, and CVVT (Continuously Variable Valve Timing) engines. Built on an updated platform with improved handling dynamics, it was offered as 4-door sedan and 3-door hatchback. Engine options included 1.4L Alpha I4 and 1.6L CVVT Alpha II I4 petrol, plus a 1.5L D I4 turbo-diesel CRDi with VGT. In India, this generation was marketed as Verna while the previous generation continued alongside as the Accent. Safety improvements were notable, though crash test ratings remained mixed by modern standards. Production varied by region, running until 2010 in most markets but continuing in India (until 2011) and Turkey (until 2012)."

  - name: "Fourth Generation (RB/RC)"
    start_year: 2010
    end_year: 2019
    description: "The fourth-generation Accent/Verna (RB for sedan, RC for China) debuted at the 2010 Beijing Auto Show with Hyundai's 'Fluidic Sculpture' design language featuring dynamic, flowing lines. Built on the Hyundai-Kia PB platform, it was offered as 4-door sedan and 5-door hatchback. Engine options expanded significantly: 1.4L and 1.6L Gamma series petrol engines with both MPI and GDI variants, plus diesel options. Transmission options included 5/6-speed manual, 4/6-speed automatic, 7-speed DCT, and CVT. Known as Solaris in Russia (where the Accent name remained for the previous generation), it achieved 5-star China NCAP rating. In India, launched as Verna in May 2011 with 1.4L and 1.6L petrol and diesel engines, it received multiple facelifts including a major update in 2015. Production continued in Egypt well beyond 2019, still ongoing as of 2025."

  - name: "Fifth Generation (HC/YC)"
    start_year: 2017
    end_year: 2023
    description: "The fifth-generation Accent/Verna (HC for sedan, YC for China) launched in late 2016/early 2017 with more mature styling and Hyundai's signature cascading grille. Built on the Hyundai-Kia K2 platform, it was offered as 4-door sedan and 5-door hatchback (hatchback not available in US). Engine options were extensive: 1.0L Kappa II T-GDi turbo (7-speed DCT), 1.4L Kappa II MPi, 1.5L Smartstream MPi (CVT), 1.6L Gamma II MPI/GDi, and 1.5L U II CRDi diesel. Notably, this generation was not sold in South Korea (replaced by Venue crossover) and was discontinued in Australia for the same reason. In India, launched as Verna in August 2017 with 1.6L petrol and diesel engines, it received a major facelift in March 2020 with new engine options including 1.5L petrol and 1.0L turbo. The Accent was discontinued in the US after 2022, replaced by the Venue."

  - name: "Sixth Generation (BN7)"
    start_year: 2023
    end_year: null
    description: "The current sixth-generation Verna (BN7) was unveiled in India on February 13, 2023, adopting Hyundai's 'Sensuous Sportiness' design language with bold parametric grille, connected LED light bar, and fastback profile. Significantly larger than its predecessor with near-midsize interior space within a compact footprint, it's built on an updated platform. Engine options include a 1.5L Smartstream G1.5 MPi (115hp, 144Nm) paired with 6-speed manual or CVT, and a 1.5L Smartstream G1.5 T-GDi turbo (158hp, 253Nm) paired with 6-speed manual or 7-speed DCT. The interior features a horizontal dashboard with dual 10.25-inch screens under one glass panel in higher trims, ambient lighting, and premium materials. Technology includes advanced driver assistance systems (ADAS), ventilated seats, Bose audio, and over-the-air updates. Launched in India on March 21, 2023, it achieved a 5-star Global NCAP rating for adult and child occupants in October 2023. Also sold in Vietnam (from May 2024), UAE (early 2025), Philippines (October 2025), and Brunei (May 2025)."
